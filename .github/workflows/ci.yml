name: CI



on:

  push:

    branches: [main, master, develop]

  pull_request:

    branches: [main, master, develop]



env:

  DATABASE_URL: postgresql+asyncpg://si:si@localhost:5432/store_intelligence

  API_KEY: purple-demo-key

  API_KEY_REQUIRED: "true"

  SEED_DEMO_DATA: "true"

  METRICS_PROJECTOR_ENABLED: "true"

  ENVIRONMENT: test



jobs:

  pytest-and-coverage:

    name: Pytest & coverage

    runs-on: ubuntu-latest



    services:

      postgres:

        image: postgres:16-alpine

        env:

          POSTGRES_USER: si

          POSTGRES_PASSWORD: si

          POSTGRES_DB: store_intelligence

        ports:

          - 5432:5432

        options: >-

          --health-cmd "pg_isready -U si -d store_intelligence"

          --health-interval 5s

          --health-timeout 5s

          --health-retries 12



    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

          cache: pip



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -e ".[dev]"



      - name: Wait for PostgreSQL

        run: python scripts/wait_for_database.py



      - name: Run database migrations

        run: alembic upgrade head



      - name: Pytest

        run: |

          mkdir -p docs/evidence

          python -m pytest tests/ \

            --cov=app \

            --cov-branch \

            --cov-fail-under=95 \

            --cov-report=term-missing \

            --cov-report=xml:docs/evidence/coverage.xml \

            --junitxml=docs/evidence/junit.xml \

            --import-mode=importlib \

            -q 2>&1 | tee docs/evidence/pytest.log



      - name: Record pytest results

        if: always()

        run: |

          python - <<'PY'

          import json, re, xml.etree.ElementTree as ET

          from pathlib import Path

          from datetime import UTC, datetime



          root = Path("docs/evidence")

          log = (root / "pytest.log").read_text(encoding="utf-8", errors="replace")

          passed = re.search(r"(\d+) passed", log)

          cov = re.search(r"Total coverage:\s*([\d.]+)%", log, re.S)

          payload = {

              "success": " failed" not in log and "ERROR" not in log.splitlines()[-3:],

              "passed": int(passed.group(1)) if passed else None,

              "coverage_pct": float(cov.group(1)) if cov else None,

              "recorded_at": datetime.now(tz=UTC).isoformat(),

          }

          xml = root / "coverage.xml"

          if xml.is_file():

              r = ET.parse(xml).getroot()

              payload["lines_valid"] = int(r.get("lines-valid", 0))

              payload["lines_covered"] = int(r.get("lines-covered", 0))

              if payload.get("coverage_pct") is None:

                  payload["coverage_pct"] = round(float(r.get("line-rate", 0)) * 100, 2)

          junit = root / "junit.xml"

          if junit.is_file():

              s = ET.parse(junit).getroot()

              if s.tag != "testsuite":

                  s = s.find("testsuite")

              if s is not None:

                  payload["tests"] = int(s.get("tests", 0))

                  payload["failures"] = int(s.get("failures", 0))

          (root / "ci_pytest.json").write_text(json.dumps(payload, indent=2))

          PY



      - name: Upload pytest artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: pytest-artifacts

          path: |

            docs/evidence/pytest.log

            docs/evidence/coverage.xml

            docs/evidence/junit.xml

            docs/evidence/ci_pytest.json



  api-validation:

    name: API validation

    runs-on: ubuntu-latest

    needs: pytest-and-coverage



    services:

      postgres:

        image: postgres:16-alpine

        env:

          POSTGRES_USER: si

          POSTGRES_PASSWORD: si

          POSTGRES_DB: store_intelligence

        ports:

          - 5432:5432

        options: >-

          --health-cmd "pg_isready -U si -d store_intelligence"

          --health-interval 5s

          --health-timeout 5s

          --health-retries 12



    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

          cache: pip



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -e ".[dev]"



      - name: Wait for PostgreSQL

        run: python scripts/wait_for_database.py



      - name: Run database migrations

        run: alembic upgrade head



      - name: Seed demo store

        run: python scripts/seed_dev_data.py



      - name: Start API server

        run: |

          uvicorn app.main:app --host 127.0.0.1 --port 8000 &

          echo $! > /tmp/api.pid

          for i in $(seq 1 30); do

            if python scripts/healthcheck.py; then

              echo "API ready"

              exit 0

            fi

            sleep 2

          done

          echo "API failed to start"

          exit 1



      - name: Validation (API-only)

        run: |

          mkdir -p docs/evidence

          python scripts/validate_submission.py --api-only 2>&1 | tee docs/evidence/validation.log



      - name: Record validation results

        if: always()

        run: |

          python - <<'PY'

          import json

          from pathlib import Path

          from datetime import UTC, datetime



          log = Path("docs/evidence/validation.log")

          text = log.read_text(encoding="utf-8") if log.is_file() else ""

          summary = next((l for l in text.splitlines() if "checks passed" in l), "")

          payload = {

              "success": "0/" not in summary and "checks passed" in summary,

              "summary": summary.strip(),

              "stdout_tail": text.strip().splitlines()[-12:],

              "recorded_at": datetime.now(tz=UTC).isoformat(),

          }

          Path("docs/evidence/ci_validation.json").write_text(json.dumps(payload, indent=2))

          PY



      - name: Stop API server

        if: always()

        run: |

          if [ -f /tmp/api.pid ]; then

            kill "$(cat /tmp/api.pid)" || true

          fi



      - name: Upload validation artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: validation-artifacts

          path: |

            docs/evidence/validation.log

            docs/evidence/ci_validation.json



  docker-compose-verify:

    name: Docker Compose verify

    runs-on: ubuntu-latest

    needs: pytest-and-coverage



    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

          cache: pip



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -e ".[dev]"



      - name: Docker Compose verification

        run: python scripts/verify_docker_compose.py



      - name: Upload Docker artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: docker-artifacts

          path: docs/evidence/ci_docker_compose.json



  ci-evidence:

    name: Generate CI evidence

    runs-on: ubuntu-latest

    needs: [pytest-and-coverage, api-validation, docker-compose-verify]

    if: always()



    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Download pytest artifacts

        uses: actions/download-artifact@v4

        with:

          name: pytest-artifacts

          path: docs/evidence



      - name: Download validation artifacts

        uses: actions/download-artifact@v4

        with:

          name: validation-artifacts

          path: docs/evidence



      - name: Download Docker artifacts

        uses: actions/download-artifact@v4

        with:

          name: docker-artifacts

          path: docs/evidence



      - name: Generate CI_EVIDENCE.md

        run: python scripts/generate_ci_evidence.py



      - name: Upload CI evidence report

        uses: actions/upload-artifact@v4

        with:

          name: ci-evidence

          path: |

            CI_EVIDENCE.md

            docs/evidence/ci_results.json


